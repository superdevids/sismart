services:
  postgres:
    image: postgres:18-alpine
    container_name: sismart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sismart
      POSTGRES_PASSWORD: sismart123
      POSTGRES_DB: sismart
      TZ: Asia/Jakarta
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - sismart-pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sismart -d sismart']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sismart-pgdata:
